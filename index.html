        <div style="background:#fef9c3;border:1.5px solid #fde047;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:11px;font-weight:600;color:#713f12;">
          💡 This records actual stock counted on the selected date. Variance = Actual − Spare Stock (Production − Orders) for that period.
        </div>
        <button class="sbtn" onclick="saveStockRecording()">Save Stock Recording</button>
      </div>`;
      return;
    }
    // ── Record Production sub-view ─────────────────────────────
    if(vw==='stock_prod'){
      const allProds = getAllStockProducts(); // all 4 cats, not just tracked
      if(!stockProdForm.date) stockProdForm.date=tdi();
      const isEditing = !!stockProdEditId;
      const buildOptions = (selectedPid) => {
        const cats = [
          { key:'snack',   label:'Snacks',   emoji:'🍘' },
          { key:'powder',  label:'Podi',      emoji:'🌿' },
          { key:'special', label:'Specials',  emoji:'✨' },
          { key:'pickle',  label:'Pickles',   emoji:'🫙' },
        ];
        const q = stockProdSearch.toLowerCase();
        return cats.map(c=>{
          const prods = allProds.filter(pr=>pr.c===c.key && (!q || pr.n.toLowerCase().includes(q)));
          if(!prods.length) return '';
          return `<optgroup label="${c.emoji} ${c.label}">${prods.map(pr=>`<option value="${pr.id}"${selectedPid==pr.id?' selected':''}>${pr.n}</option>`).join('')}</optgroup>`;
        }).join('');
      };
      el.innerHTML=`<div class="main">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
          <div class="bk" onclick="stockProdEditId=null;stockProdSearch='';vw='home';render()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#403844" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></div>
          <div><div style="font-size:17px;font-weight:800;color:var(--text-dark);">${isEditing?'Edit Production':'Record Production'}</div><div style="font-size:12px;color:var(--text-muted);font-weight:600;">${isEditing?'Update this production entry':'Enter what was made today'}</div></div>
        </div>
        <div class="card" style="margin-bottom:12px;">
          <label class="fl">Production Date</label>
          <input class="fi" type="date" value="${stockProdForm.date}" onchange="stockProdForm.date=this.value" style="margin-bottom:0;"/>
        </div>
        <div style="position:relative;margin-bottom:10px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="fi" type="text" placeholder="Search products…" value="${stockProdSearch}" oninput="stockProdSearch=this.value;rc()" style="padding-left:34px;margin-bottom:0;"/>
        </div>
        <div class="sl">Items Produced</div>
        <div id="sprod-wrap">
          ${stockProdForm.items.map((it,i)=>{
            const p=it.pid?allProds.find(x=>x.id===parseInt(it.pid)):null;
            return `<div class="ir" style="margin-bottom:10px;">
              <div class="ir-top">
                <div class="ir-num">${String(i+1).padStart(2,'0')}</div>
                <select class="is" onchange="updateStockProdPid(${i},this.value)">
                  <option value="">Choose product...</option>
                  ${buildOptions(it.pid)}
                </select>
                <div class="rb" onclick="removeStockProdItem(${i})">✕</div>
              </div>
              <div class="ir-bottom">
                <span class="ir-pname${p?'':' empty'}">${p?p.n:'No product selected'}</span>
                <div class="ir-sep"></div>
                <div class="ir-qty-group">
                  <span class="ir-qty-lbl">Qty</span>
                  <input class="iq" type="number" min="0" step="0.1" placeholder="0" value="${it.qty}" oninput="updateStockProdQty(${i},this.value)"/>
                  <span style="font-size:11px;font-weight:700;color:var(--text-muted);min-width:16px;">${p?p.u:''}</span>
                </div>
              </div>
            </div>`;
          }).join('')}
          <button class="ab2" onclick="addStockProdItem()">+ Add Item</button>
        </div>
        <button class="sbtn" style="margin-top:14px;" onclick="saveStockProd()">${isEditing?'Update Production':'Save Production'}</button>
      </div>`;
      return;
    }
    // ── Stock main view ────────────────────────────────────────
    const mode = stockData.periodMode || 'fortnightly';
    const period = getStockPeriodAt(mode, stockPeriodOffset);
    const isCurrentPeriod = stockPeriodOffset === 0;
    const totalProd = (stockData.productionLog||[]).reduce((s,l)=>s+l.items.filter(it=>getTrackedProducts().find(p=>p.id===parseInt(it.pid))).reduce((ss,it)=>ss+(parseFloat(it.qty)||0),0),0);
    const recentLogs = (stockData.productionLog||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
    // Most recent stock recording across all time (for the badge)
    const latestRec = (stockData.stockRecordings||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    // Recording in current viewed period
    const periodRec = (stockData.stockRecordings||[])
      .filter(r=>{const d=new Date(r.date);return d>=period.start&&d<=period.end;})
      .sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    el.innerHTML=`<div class="main">
      <div class="pg-title">Stock</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div style="background:var(--white);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(64,56,68,.04);">
          <div style="font-size:9px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Total Produced</div>
          <div style="font-size:22px;font-weight:800;color:#16a34a;">${totalProd.toFixed(1)}<span style="font-size:12px;font-weight:600;color:var(--text-muted);margin-left:3px;">kg</span></div>
        </div>
        <div style="background:var(--white);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(64,56,68,.04);">
          <div style="font-size:9px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Last Recording</div>
          <div style="font-size:13px;font-weight:800;color:var(--text-dark);">${latestRec ? fdate(latestRec.date) : '—'}</div>
          ${latestRec?`<div style="font-size:9px;font-weight:600;color:var(--text-muted);margin-top:2px;">Actual count on file</div>`:'<div style="font-size:9px;font-weight:600;color:var(--text-muted);margin-top:2px;">None yet</div>'}
        </div>
      </div>
      <button class="abtn" style="background:#f8f4ff;border:1.5px solid #d8b4fe;margin-bottom:0;" onclick="vw='stock_configure';render()">
        <div class="ico" style="background:#f3e8ff;border:1.5px solid #d8b4fe;"><svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
        <div style="flex:1;"><div class="at" style="color:#7c3aed;">Configure Products</div><div class="adt">Include / exclude products from tracking</div></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="abtn" style="background:#f0fdf4;border:1.5px solid #bbf7d0;margin-bottom:0;" onclick="stockRecForm={date:tdi(),items:[]};vw='stock_recording';render()">
        <div class="ico" style="background:#dcfce7;border:1.5px solid #bbf7d0;"><svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
        <div style="flex:1;"><div class="at" style="color:#16a34a;">Record End of Week Stock</div><div class="adt">Enter actual stock count — variance tracked</div></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="abtn" style="background:var(--pink-pale);border:1.5px solid var(--pink-border);margin-bottom:14px;" onclick="stockProdForm={date:tdi(),items:[{pid:'',qty:''}]};stockProdEditId=null;stockProdSearch='';vw='stock_prod';render()">
        <div class="ico" style="background:#f9e6f1;border:1.5px solid var(--pink-border);"><svg viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div style="flex:1;"><div class="at">Record Production</div><div class="adt">Log items produced today</div></div>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <div style="font-size:13px;font-weight:800;color:var(--text-dark);flex:1;">Stock Overview</div>
          ${['weekly','fortnightly','monthly'].map(m=>`<button onclick="stockData.periodMode='${m}';stockPeriodOffset=0;scheduleSave();rc();" style="padding:4px 8px;border-radius:10px;border:1.5px solid ${mode===m?'var(--pink)':'var(--border)'};background:${mode===m?'var(--pink-pale)':'var(--white)'};color:${mode===m?'var(--pink)':'var(--text-muted)'};font-size:9px;font-weight:800;font-family:inherit;cursor:pointer;">${m==='fortnightly'?'2-Wk':m==='weekly'?'Wk':'Mo'}</button>`).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
          <button onclick="stockPeriodOffset--;rc();" style="width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div style="flex:1;text-align:center;">
            <div style="font-size:11px;font-weight:800;color:var(--text-dark);">${period.label}</div>
            <div style="font-size:9px;font-weight:700;margin-top:2px;color:${isCurrentPeriod?'var(--pink)':'var(--text-muted)'};">${isCurrentPeriod?'Current period':Math.abs(stockPeriodOffset)+' period'+(Math.abs(stockPeriodOffset)>1?'s':'')+' ago'}</div>
          </div>
          <button onclick="if(stockPeriodOffset<0){stockPeriodOffset++;rc();}" style="width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border);background:${isCurrentPeriod?'var(--lavender)':'var(--white)'};display:flex;align-items:center;justify-content:center;cursor:${isCurrentPeriod?'default':'pointer'};flex-shrink:0;opacity:${isCurrentPeriod?'0.3':'1'};">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        ${periodRec ? `<div style="display:flex;align-items:center;gap:6px;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:8px 10px;margin-bottom:12px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5"><path d="M9 11l3 3L22 4"/></svg>
          <span style="font-size:11px;font-weight:700;color:#16a34a;flex:1;">Stock recorded on ${fdate(periodRec.date)} — variance shown</span>
          <button onclick="delStockRecording('${periodRec.id}')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">✕</button>
        </div>` : `<div style="display:flex;align-items:center;gap:6px;background:var(--lavender);border-radius:10px;padding:8px 10px;margin-bottom:12px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span style="font-size:11px;font-weight:600;color:var(--text-muted);">No stock recording this period — variance not available</span>
        </div>`}
        ${renderStockTable()}
      </div>
      ${recentLogs.length>0?`
      <div class="sl">Recent Production</div>
      ${recentLogs.map(l=>{
        const tracked=getTrackedProducts();
        const summary=l.items.map(it=>{const p=tracked.find(x=>x.id===parseInt(it.pid));return p?`${p.n} × ${it.qty}${p.u}`:''}).filter(Boolean).join(' · ');
        const totalQty=l.items.reduce((s,it)=>s+(parseFloat(it.qty)||0),0);
        return `<div style="background:var(--white);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 2px 6px rgba(64,56,68,.04);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <div style="font-size:12px;font-weight:800;color:var(--text-dark);">${fdate(l.date)}</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-size:13px;font-weight:800;color:#16a34a;">+${totalQty.toFixed(1)} kg</div>
              <button onclick="editProductionLog('${l.id}')" style="background:#eff6ff;color:#1d4ed8;border:none;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">✏️</button>
              <button onclick="delProductionLog('${l.id}')" style="background:#fee2e2;color:#991b1b;border:none;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">✕</button>
            </div>
          </div>
          <div style="font-size:11px;color:var(--text-muted);font-weight:600;">${summary}</div>
        </div>`;
      }).join('')}`:''}
    </div>`;
    return;
  } else if(pg==="Rate Adjustment Logs"){
    el.innerHTML=`<div class="main">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
        <div class="bk" onclick="sp('Home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#403844" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div><div style="font-size:17px;font-weight:800;color:var(--text-dark);">Rate Adjustment Logs</div></div>
      </div>
      ${rateAdjLogs.length===0
        ?`<div class="em"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><div class="et">No adjustments yet</div><div style="font-size:13px;font-weight:500;">Rate adjustments made during orders will appear here</div></div>`
        :rateAdjLogs.slice().reverse().map(log=>`
          <div class="ocrd" style="padding:14px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div style="flex:1;">
                <div style="font-size:13px;font-weight:800;color:var(--text-dark);">${log.prodName}</div>
                <div style="font-size:11px;color:var(--text-muted);font-weight:600;margin-top:2px;">${fdate(log.date)} · ${log.orderId}</div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <div style="font-size:12px;font-weight:700;color:#dc2626;text-decoration:line-through;">₹${log.oldRate}</div>
                <div style="font-size:14px;font-weight:800;color:#f97316;">₹${log.newRate}</div>
              </div>
            </div>
            <div style="margin-top:8px;font-size:11px;font-weight:700;color:var(--text-muted);background:var(--lavender);border-radius:8px;padding:6px 10px;">
              Rate adjusted from ₹${log.oldRate} to ₹${log.newRate}
            </div>
          </div>`).join("")}
    </div>`;
  } else if(pg==="Export / Import Data"){
    el.innerHTML=`<div class="main">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
        <div class="bk" onclick="sp('Home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#403844" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div><div style="font-size:17px;font-weight:800;color:var(--text-dark);">Export / Import Data</div></div>
      </div>
      <div class="card" style="margin-bottom:12px;">
        <div style="font-size:14px;font-weight:800;color:var(--text-dark);margin-bottom:6px;">📤 Export Backup</div>
        <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:14px;">Download all app data as a JSON file. Store it safely as a backup.</div>
        <button class="sbtn" style="margin-top:0;" onclick="exportData()">Download Backup JSON</button>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:800;color:var(--text-dark);margin-bottom:6px;">📥 Import Backup</div>
        <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:14px;">Restore from a previously exported JSON file. <strong style="color:#dc2626;">This will overwrite all current data.</strong></div>
        <button class="sbtn" style="margin-top:0;background:var(--charcoal);" onclick="importData()">Choose Backup File</button>
      </div>
    </div>`;
  } else if(pg==="Reset App"){
    el.innerHTML=`<div class="main">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
        <div class="bk" onclick="sp('Home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#403844" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div><div style="font-size:17px;font-weight:800;color:var(--text-dark);">Reset App</div></div>
      </div>
      <div class="card" style="border:2px solid #fecaca;">
        <div style="font-size:14px;font-weight:800;color:#dc2626;margin-bottom:6px;">⚠️ Danger Zone</div>
        <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:14px;">This will permanently delete ALL orders, expenses, customers, and balances from the database. This <strong>cannot be undone.</strong> Export a backup first if needed.</div>
        <button class="sbtn" style="margin-top:0;background:#dc2626;box-shadow:0 4px 16px rgba(220,38,38,.25);" onclick="confirmReset()">Reset All Data</button>
      </div>
    </div>`;
  } else {
    el.innerHTML=`<div class="main">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
        <div class="bk" onclick="sp('Home')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#403844" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div><div style="font-size:17px;font-weight:800;color:var(--text-dark);">${pg}</div></div>
      </div>
      <div class="em">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 13h4"/></svg>
      <div class="et">Coming Soon</div><div style="font-size:13px;font-weight:500;">This module is under construction.</div>
    </div></div>`;
  }
}
function render(){
  if(!isLoggedIn) return;
  rn();rc();
  const lw=document.querySelector('.logo-wrap');
  const hdr=document.querySelector('.hdr');
  if(pg==="Home"&&vw==="home"){
    if(lw)lw.style.display="flex";
    if(hdr)hdr.style.paddingBottom="12px";
  }else{
    if(lw)lw.style.display="none";
    if(hdr)hdr.style.paddingBottom="40px";
  }
}

async function confirmReset(){
  if(!confirm('Are you absolutely sure? ALL orders, expenses, customers and balances will be permanently deleted.')) return;
  custs=[]; ords=[]; exps=[]; dcbList=[]; bankDcbList=[]; miscBankIncomes=[];
  stockData={ openBal:{}, productionLog:[], periodMode:'fortnightly', stockRecordings:[], excludedProducts:[], includedProducts:[], presets:[] };
  expCats=["Labour - Annamma","Labour - Sheeba","Labour - Leela","Labour - Jancy","Utilities - Gas","Utilities - Elec","Personal","Raw Materials","Variance Reconciliation","Discount","Missing Payments","Grocery & Household"];
  expNonBiz=["Personal","Grocery & Household"];
  openBals={cash:{date:tdi(),amt:0},bank:{date:tdi(),amt:0}};
  expFilterStart=getStartOfMonth(); expFilterEnd=tdi();
  await persistData();
  stk('App has been reset','ok');
  sp('Home');
}
</script>

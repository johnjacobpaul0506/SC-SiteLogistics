<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ammu's Products</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --logo-bg: #f0ebf5; 
  --magenta: #b81273; 
  --charcoal: #403844; 
  
  --pink: var(--magenta);
  --pink-light: #d63d95;
  --pink-pale: #f9e6f1;
  --pink-border: #f1bddd;
  
  --purple-dark: var(--charcoal);
  --purple-mid: #685972;
  
  --lavender: #f0ebf5; 
  --lavender-mid: #c7b8d8;
  --lavender-dark: var(--charcoal);
  
  --white: #ffffff;
  --offwhite: #fcfbfe;
  
  --text-dark: var(--charcoal);
  --text-mid: #685972;
  --text-muted: #958a9e;
  --border: #e4dcf0;
}
body { background: #e0d5e9; overflow: hidden; }

/* Strictly constrained app bounds to guarantee bottom nav visibility */
.shell{background:var(--lavender);height:100vh;height:100dvh;display:flex;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden;}
.phone{width:100%;max-width:420px;display:flex;flex-direction:column;height:100%;background:var(--lavender);position:relative;overflow:hidden;}
.hdr{background:transparent;padding:32px 20px 12px;display:flex;flex-direction:column;align-items:center;z-index:10;position:relative;flex-shrink:0;}
.menu-btn{position:absolute;top:32px;right:20px;width:40px;height:40px;border-radius:12px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(64,56,68,.05);cursor:pointer;z-index:100;}
.logo-wrap{width:250px;height:250px;border-radius:24px;overflow:hidden;flex-shrink:0;}
.logo-wrap img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply;border-radius:24px;}

/* Main area scrolls naturally without disturbing the bottom nav */
.main{flex:1;overflow-y:auto;padding:20px 13px 20px;background:var(--lavender);}

.pg-title{font-size:18px;font-weight:800;color:var(--text-dark);margin-bottom:14px;}
.sl{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.abtn{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;border-radius:20px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:10px;border:none;transition:transform .15s;}
.abtn:active{transform:scale(.97);}
.ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.at{font-size:14px;font-weight:700;color:var(--text-dark);line-height:1.3;}
.adt{font-size:11px;color:var(--text-muted);margin-top:2px;}
.card{background:var(--white);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(64,56,68,.04);}
.fl{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;}
.fi{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--white);color:var(--text-dark);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--pink);}
.fi:disabled{color:var(--text-muted);background:#fcfbfe;cursor:not-allowed;}
.fi.autofilled{border-color:#16a34a;background:#f0fdf4;color:#166534;}
.fi[type=date]::-webkit-calendar-picker-indicator{opacity:.5;}
.fg{margin-bottom:12px;position:relative;}
.tc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pw{display:flex;gap:8px;}
.px{padding:11px 13px;border-radius:12px;border:1.5px solid var(--border);background:var(--pink-pale);color:var(--pink);font-size:13px;font-weight:700;white-space:nowrap;}
.dl{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1.5px solid var(--border);border-radius:12px;z-index:50;max-height:150px;overflow-y:auto;box-shadow:0 8px 24px rgba(64,56,68,.14);}
.di{padding:10px 13px;font-size:13px;color:var(--text-dark);cursor:pointer;border-bottom:1px solid var(--lavender);display:flex;justify-content:space-between;align-items:center;}
.di:last-child{border-bottom:none;}
.di:hover{background:var(--pink-pale);}
.match-hint{font-size:11px;color:#16a34a;font-weight:600;margin-top:5px;display:flex;align-items:center;gap:4px;}
.ir{background:#fcfbfe;border-radius:14px;border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden;}
.ir-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
.ir-num{width:22px;height:22px;border-radius:6px;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--white);flex-shrink:0;}
.is{flex:1;padding:8px 10px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);color:var(--text-dark);font-size:13px;font-family:inherit;outline:none;}
.is:focus{border-color:var(--pink);}
.rb{width:26px;height:26px;border-radius:7px;border:1.5px solid #fecaca;background:#fff5f5;color:#ef4444;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;flex-shrink:0;}
.ir-bottom{display:flex;align-items:center;padding:10px 12px;}
.ir-pname{flex:1;font-size:13px;font-weight:700;color:var(--text-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ir-pname.empty{color:var(--text-muted);font-style:italic;font-weight:400;font-size:12px;}
.ir-sep{width:1px;height:18px;background:var(--border);margin:0 10px;flex-shrink:0;}
.ir-qty-group{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ir-qty-lbl{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;}
.iq{width:42px;padding:6px 5px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);color:var(--text-dark);font-size:13px;font-family:inherit;outline:none;text-align:center;font-weight:700;}
.iq:focus{border-color:var(--pink);}
.ir-price{font-size:14px;font-weight:800;color:var(--pink);min-width:52px;text-align:right;margin-left:10px;}
.ab2{width:100%;padding:11px;border-radius:12px;border:2px dashed var(--lavender-mid);background:transparent;color:var(--text-mid);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:2px;transition:all .2s;}
.ab2:hover{border-color:var(--pink);color:var(--pink);}
.totrow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;background:var(--pink-pale);border:2px solid var(--pink-border);margin-top:12px;}
.sbtn{width:100%;padding:14px;border-radius:16px;border:none;background:var(--pink);color:var(--white);font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:14px;box-shadow:0 4px 16px rgba(184,18,115,.25);}
.sbtn:active{transform:scale(.98);}
.pcrd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--white);margin-bottom:10px;box-shadow:0 2px 6px rgba(64,56,68,.04);}
.pnum{width:24px;height:24px;border-radius:7px;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--white);flex-shrink:0;margin-right:12px;}
.bdg{font-size:9px;padding:3px 8px;border-radius:20px;font-weight:700;display:inline-block;margin-top:4px;}
.bs{background:#ede9fe;color:#6d28d9;}.bp{background:#fef9c3;color:#854d0e;}.bx{background:#f9e6f1;color:#b81273;}.bpk{background:#dcfce7;color:#166534;}
.ccrd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--white);margin-bottom:10px;box-shadow:0 2px 6px rgba(64,56,68,.04);}
.cav{width:42px;height:42px;border-radius:12px;background:var(--purple-dark);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--white);flex-shrink:0;}
.sec-header{display:flex;align-items:center;gap:8px;margin:16px 0 10px;}
.sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sec-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.sec-count{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:auto;}
.ocrd{background:var(--white);border-radius:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(64,56,68,.04);overflow:hidden;}
.ocrd-head{padding:14px 14px 10px;}
.ocrd-id{font-size:10px;font-weight:800;color:var(--pink);letter-spacing:.04em;}
.ocrd-date{font-size:11px;color:var(--text-muted);font-weight:600;}
.ocrd-name{font-size:15px;font-weight:800;color:var(--text-dark);margin-top:4px;}
.ocrd-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.ocrd-items{padding:0 14px 10px;font-size:12px;color:var(--text-mid);line-height:1.7;font-weight:500;}
.ocrd-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.ocrd-total{font-size:17px;font-weight:800;}
.ocrd-actions{display:flex;gap:5px;flex-wrap:nowrap;margin-top:4px;width:100%;overflow:hidden;}
.oact{padding:5px 7px;border-radius:9px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border:none;white-space:nowrap;}
.oact:active{opacity:.7;}
.oact-complete{background:#ffedd5;color:#c2410c;}
.oact-pay{background:#dcfce7;color:#166534;}
.oact-invoice{background:var(--lavender);color:var(--text-dark);}
.oact-del{background:#fee2e2;color:#991b1b;margin-left:auto;}
.oact-paid-badge{background:#dcfce7;color:#166534;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:800;}
.modal-overlay{background:rgba(64,56,68,.6);min-height:580px;display:flex;align-items:flex-end;justify-content:center;border-radius:16px;position:relative;z-index:150;}
.modal-sheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;padding:28px 24px 36px;}
.modal-title{font-size:18px;font-weight:800;color:var(--text-dark);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;}
.pay-opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:2px solid var(--border);cursor:pointer;margin-bottom:12px;transition:all .2s;background:var(--white);}
.pay-opt:hover,.pay-opt.selected{border-color:var(--pink);background:var(--pink-pale);}
.pay-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.pay-label{font-size:16px;font-weight:800;color:var(--text-dark);}
.pay-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.modal-confirm{width:100%;padding:15px;border-radius:16px;border:none;background:var(--pink);color:var(--white);font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:8px;}
.modal-cancel{width:100%;padding:14px;border-radius:16px;border:1.5px solid var(--border);background:var(--white);color:var(--text-muted);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px;}

/* ---- Minimal Invoice CSS ---- */
.inv-page{background:var(--offwhite);padding:0 0 80px;}
.inv-topbar{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;}
.inv-doc{background:var(--white);border-radius:8px;margin:0 14px;padding:20px;border:1px solid #e5e5e5;box-shadow:0 2px 8px rgba(0,0,0,.03);}
.inv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e5e5e5;}
.inv-bname{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;color:#333;}
.inv-bsub{font-size:10px;color:#666;margin-top:2px;}
.inv-badge{font-size:16px;font-weight:700;color:#999;letter-spacing:1px;}
.inv-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e5e5e5;}
.inv-meta-lbl{font-size:9px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;}
.inv-meta-val{font-size:11px;font-weight:600;color:#333;margin-top:2px;}
.inv-cust{margin-bottom:16px;}
.inv-cust-lbl{font-size:9px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.inv-cust-name{font-size:12px;font-weight:700;color:#333;}
.inv-cust-mob{font-size:11px;color:#666;margin-top:2px;}
.inv-items-header{display:grid;grid-template-columns:1fr 38px 72px;gap:8px;padding:6px 0;border-bottom:1px solid #333;margin-bottom:6px;}
.inv-col-lbl{font-size:9px;font-weight:700;color:#333;text-transform:uppercase;}
.inv-col-lbl.right{text-align:right;}
.inv-item-row{display:grid;grid-template-columns:1fr 38px 72px;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;align-items:center;}
.inv-item-name{font-size:11px;font-weight:600;color:#333;}
.inv-item-unit{font-size:9px;color:#888;}
.inv-item-qty{font-size:11px;font-weight:600;color:#333;text-align:center;}
.inv-item-total{font-size:11px;font-weight:600;color:#333;text-align:right;}
.inv-total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0 0;margin-top:8px;}
.inv-total-lbl{font-size:10px;font-weight:700;color:#333;text-transform:uppercase;}
.inv-total-amt{font-size:14px;font-weight:800;color:#111;}
.inv-footer{text-align:center;margin-top:20px;font-size:10px;color:#999;}

.share-bar{display:flex;gap:10px;margin:16px 14px 0;}
.share-btn{flex:1;padding:13px;border-radius:14px;border:none;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.share-btn:active{opacity:.8;}
.em{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 20px;color:var(--text-muted);text-align:center;}
.et{font-size:18px;font-weight:800;color:var(--text-dark);}
.tk{padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:center;margin:0 16px 12px;display:none;position:relative;z-index:250;}
.tk.on{display:block;}.tk.ok{background:#dcfce7;color:#166534;}.tk.er{background:#fee2e2;color:#991b1b;}
.bk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.oid-badge{background:var(--offwhite);border:1.5px solid var(--border);padding:8px 12px;border-radius:10px;font-size:11px;font-weight:800;color:var(--text-dark);letter-spacing:.04em;}

/* Floating Elevated Bottom Navigation */
.bottomnav{margin: 0 16px 24px 16px; background:var(--white);display:flex;z-index:100;padding:6px;border-radius:24px;box-shadow:0 8px 32px rgba(64,56,68,.1); flex-shrink:0;}
.filter-scroll::-webkit-scrollbar{display:none;}
.bnb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;cursor:pointer;border:none;background:transparent;font-family:inherit;transition:all 0.2s;border-radius:16px;}
.bnb .lbl{font-size:9px;font-weight:700;color:var(--text-muted);white-space:nowrap;}
.bnb .ico2{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.bnb.on .lbl{color:var(--pink);}
.bnb.on .ico2 svg{stroke:var(--pink);}
.bnb:not(.on) .ico2 svg{stroke:var(--text-muted);}
.bnb.on{background:var(--pink-pale);}

/* Date Range UI */
.dr-wrap { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.dr-inp { flex: 1; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--border); font-family: inherit; font-size: 13px; color: var(--text-dark); background: var(--white); outline: none; }
.dr-inp:focus { border-color: var(--pink); }
.stat-card { background: var(--white); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(64,56,68,.04); }
.stat-lbl { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.stat-val { font-size: 24px; font-weight: 800; color: var(--text-dark); }
.stat-row { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
.stat-col { flex: 1; }

/* Side Menu / Hamburger Setup */
.side-menu {position:absolute;top:0;right:0;width:280px;height:100%;background:var(--white);z-index:200;transition:all 0.3s ease;box-shadow:-8px 0 24px rgba(64,56,68,.1);padding:30px 20px;display:flex;flex-direction:column;gap:12px; transform: translateX(100%); visibility: hidden;}
.side-menu.open {transform: translateX(0); visibility: visible;}
.menu-overlay {position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(64,56,68,.4);z-index:199;display:none;}
.menu-overlay.open {display:block;}
.menu-item {padding:14px 16px;border-radius:12px;font-size:15px;font-weight:700;color:var(--text-dark);background:var(--offwhite);cursor:pointer;border:1px solid var(--border);text-align:left;font-family:inherit; transition:all 0.1s;}
.menu-item:active {background:var(--pink-pale);border-color:var(--pink-border);color:var(--pink);}

/* ── Login Screen ──────────────────────────────────────────── */
.login-screen{position:fixed;inset:0;background:var(--lavender);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:'Plus Jakarta Sans',sans-serif;}
.login-box{width:100%;max-width:360px;padding:0 28px;}
.login-logo{width:160px;height:160px;border-radius:20px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(64,56,68,.1);overflow:hidden;margin:0 auto 28px;}
.login-logo img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;border-radius:20px;}
.login-title{font-size:22px;font-weight:800;color:var(--text-dark);text-align:center;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:28px;font-weight:600;}
.login-field{margin-bottom:14px;}
.login-field label{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px;}
.login-field input{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--border);background:var(--white);color:var(--text-dark);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;}
.login-field input:focus{border-color:var(--pink);}
.login-btn{width:100%;padding:15px;border-radius:16px;border:none;background:var(--pink);color:var(--white);font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:8px;box-shadow:0 4px 16px rgba(184,18,115,.25);}
.login-btn:active{transform:scale(.98);}
.login-err{background:#fee2e2;color:#991b1b;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:14px;display:none;}
.login-err.on{display:block;}

/* ── PIN Modal ─────────────────────────────────────────────── */
.pin-overlay{position:absolute;inset:0;background:rgba(64,56,68,.65);z-index:300;display:flex;align-items:flex-end;justify-content:center;}
.pin-sheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;padding:28px 24px 40px;}
.pin-title{font-size:18px;font-weight:800;color:var(--text-dark);text-align:center;margin-bottom:6px;}
.pin-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:24px;font-weight:600;}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:28px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s;}
.pin-dot.filled{background:var(--pink);border-color:var(--pink);}
.pin-dot.err{background:#ef4444;border-color:#ef4444;animation:pinShake .3s ease;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pin-key{padding:16px 8px;border-radius:14px;border:1.5px solid var(--border);background:var(--offwhite);font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;color:var(--text-dark);transition:all .15s;}
.pin-key:active{background:var(--pink-pale);border-color:var(--pink-border);color:var(--pink);transform:scale(.95);}
.pin-key.del{background:#fff5f5;border-color:#fecaca;color:#ef4444;font-size:16px;}
.pin-key.cancel{background:var(--lavender);border-color:var(--border);color:var(--text-muted);font-size:13px;font-weight:700;}
@keyframes pinShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
</style>
</head>
<body>
<!-- ── Login Screen ───────────────────────────────────────────── -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="logo_amethyst.png" alt="Ammu's Products" onerror="this.style.display='none';"/>

// One-time migration: freeze snapRate on all orders created before 06/05/2026
function runSnapRateMigration(){
  if(snapRateMigrated) return;
  const cutoff = new Date('2026-05-06');
  let changed = 0;
  ords.forEach(o => {
    const orderDate = parseDisplayDate(o.date);
    if(orderDate >= cutoff) return;
    o.items.forEach(it => {
      if(it.snapRate !== undefined) return;
      const p = PR.find(x => x.id === parseInt(it.pid));
      it.snapRate = it.adjRate !== undefined ? it.adjRate : (p ? p.p : 0);
      changed++;
    });
  });
  snapRateMigrated = true;
  scheduleSave();
  if(changed > 0) console.log('snapRate migration: stamped ' + changed + ' items on pre-06/05/2026 orders.');
}

function sc(s){return s.split(" ").map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(" ");}
function gid(){const n=new Date();return"ID-"+String(n.getFullYear()).slice(2)+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0")+"-"+Math.random().toString(36).substring(2,6).toUpperCase();}
function tds(){return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
function tdi(){return fmtDateLocal(new Date());}
function fdate(ds){if(!ds)return"";const p=ds.split("-");if(p.length!==3)return ds;const dt=new Date(p[0],parseInt(p[1])-1,p[2]);return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
// Returns delivery Date object for any order regardless of how it was stored
function getDelivDate(o){
  if(o.ddRaw) return new Date(o.ddRaw);
  if(o.dd){
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const parts=o.dd.split(' ');
    if(parts.length===3) return new Date(parseInt(parts[2]),months[parts[1]],parseInt(parts[0]));
  }
  return new Date(o.date); // last resort only
}
function parseDisplayDate(ds){if(!ds)return new Date('invalid');const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};const parts=ds.trim().split(' ');if(parts.length===3&&months[parts[1]]!==undefined){return new Date(parseInt(parts[2]),months[parts[1]],parseInt(parts[0]));}return new Date(ds);}
function getPaymentDate(o){if(o.payDate){const d=new Date(o.payDate);if(!isNaN(d))return d;}if(o.lastPayDate){const d=new Date(o.lastPayDate);if(!isNaN(d))return d;}return parseDisplayDate(o.date);}

function parseWAOrder(){
  const raw = waModal.text || '';
  // --- Phone ---
  const phoneM = raw.match(/\*Phone:\*\s*(\d[\d\s\-]{8,})/i);
  if(!phoneM){ stk('Could not find phone number in message','err'); return; }
  const mob = phoneM[1].replace(/\D/g,'').slice(-10);
  if(mob.length < 10){ stk('Phone number seems invalid','err'); return; }

  // --- Name ---
  const nameM = raw.match(/\*Name:\*\s*(.+)/i);
  const parsedName = nameM ? nameM[1].trim() : '';

  // --- Delivery date: "Monday, 27 April 2026" or "27 April 2026" ---
  const ddM = raw.match(/\*Requested Delivery Date:\*\s*(.+)/i);
  let ddRaw = '';
  if(ddM){
    const fullMonths = {January:1,February:2,March:3,April:4,May:5,June:6,July:7,August:8,September:9,October:10,November:11,December:12};
    const ddStr = ddM[1].trim().replace(/^[A-Za-z]+,\s*/,''); // strip "Monday, "
    const parts = ddStr.split(/\s+/);
    if(parts.length >= 3 && fullMonths[parts[1]]){
      const day = String(parseInt(parts[0])).padStart(2,'0');
      const mon = String(fullMonths[parts[1]]).padStart(2,'0');
      ddRaw = `${parts[2]}-${mon}-${day}`;
    }
  }

  // --- Items: "• Sharkara Unda × 3 kg = ₹2,160" ---
  const itemRegex = /[•·\-]\s*(.+?)\s*[×xX]\s*([\d.]+)\s*(kg|pp|serve|g)?\s*=\s*[₹Rs.]?[\d,]+/g;
  const parsedItems = [];
  const unmatched = [];
  let m;
  // Product name aliases: maps alternate/common names → canonical product name
  const PROD_ALIASES = {
    'chethu manga pickle': 'chethu manga achar',
  };

  while((m = itemRegex.exec(raw)) !== null){
    const rawName = m[1].trim();
    const qty = m[2].trim();
    // Resolve alias first
    const aliasedName = PROD_ALIASES[rawName.toLowerCase()] || rawName;
    // Exact match first, then partial
    const prod = PR.find(p => p.n.toLowerCase() === aliasedName.toLowerCase())
              || PR.find(p => p.n.toLowerCase().includes(aliasedName.toLowerCase()))
              || PR.find(p => aliasedName.toLowerCase().includes(p.n.toLowerCase()));
    if(prod){ parsedItems.push({pid:String(prod.id), qty}); }
    else { unmatched.push(rawName); }
  }

  // --- Customer lookup ---
  const existingCust = custs.find(c => c.mob === mob);
  const resolvedName = existingCust ? existingCust.name : parsedName;
  if(!existingCust && resolvedName && mob.length === 10){
    custs.push({name: resolvedName, mob, cnt: 0});
    scheduleSave();
  }

  // --- Fill order form ---
  os.name = resolvedName;
  os.mob  = mob;
  os.dd   = ddRaw;
  os.items = parsedItems.length ? parsedItems : [{pid:'',qty:''}];
  os._waSource = true;

  waModal = {open:false, text:''};
  vw = 'order';
  render();

  if(unmatched.length){
    setTimeout(()=>stk('⚠️ Unmatched items: '+unmatched.join(', '),'err'), 300);
  } else if(!existingCust){
    setTimeout(()=>stk('New customer added: '+resolvedName,'ok'), 300);
  } else {
    setTimeout(()=>stk('Matched: '+resolvedName,'ok'), 300);
  }
}
function lt(it){const p=PR.find(x=>x.id===parseInt(it.pid));if(!p)return 0;const rate=it.snapRate!==undefined?it.snapRate:it.adjRate!==undefined?it.adjRate:p.p;return rate*(parseFloat(it.qty)||0);}

function openDcbForm(){dcbForm={id:"DCB-"+gid().replace("ID-",""),date:tdi(),amt:""};vw="dcb_cash";render();}
function saveDcb(){
  if(!dcbForm.amt||isNaN(dcbForm.amt)){stk("Please enter a valid amount","err");return;}
  // Freeze the variance at the moment of saving
  const ob = openBals.cash;
  const obDate = new Date(ob.date); obDate.setHours(0,0,0,0);
  const dcbDate = new Date(dcbForm.date); dcbDate.setHours(23,59,59,999);
  const cashIn  = ords.filter(o=>(o.status==='paid'||o.status==='partial')&&new Date(o.date)>=obDate&&new Date(o.date)<=dcbDate).reduce((s,o)=>s+(o.cashPaid!==undefined?o.cashPaid:(o.payMethod==='cash'?(o.amtPaid||o.total):0)),0);
  const cashOut = exps.filter(e=>e.mode==='cash'&&new Date(e.date)>=obDate&&new Date(e.date)<=dcbDate).reduce((s,e)=>s+e.amt,0);
  const expected = ob.amt + cashIn - cashOut;
  const actual   = parseFloat(dcbForm.amt);
  const variance = actual - expected;
  dcbList.push({...dcbForm, amt:actual, cashIn, cashOut, expected, variance, obAmt:ob.amt, obDate:ob.date});
  dcbList.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(dcbList.length>30) dcbList = dcbList.slice(-30);
  scheduleSave();
  stk("Cash closing balance saved!","ok");vw="home";render();
}

function saveBankDcb(){
  if(!bankDcbForm.amt||isNaN(bankDcbForm.amt)){stk("Please enter a valid amount","err");return;}
  const ob = openBals.bank;
  const obDate = new Date(ob.date); obDate.setHours(0,0,0,0);
  const dcbDate = new Date(bankDcbForm.date); dcbDate.setHours(23,59,59,999);
  const bankIn  = ords.filter(o=>(o.status==='paid'||o.status==='partial')&&new Date(o.date)>=obDate&&new Date(o.date)<=dcbDate).reduce((s,o)=>s+(o.gpayPaid!==undefined?o.gpayPaid:(o.payMethod==='gpay'?(o.amtPaid||o.total):0)),0);
  const miscIn  = miscBankIncomes.filter(m=>new Date(m.date)>=obDate&&new Date(m.date)<=dcbDate).reduce((s,m)=>s+m.amt,0);
  const bankOut = exps.filter(e=>e.mode==='gpay'&&new Date(e.date)>=obDate&&new Date(e.date)<=dcbDate).reduce((s,e)=>s+e.amt,0);
  const expected = ob.amt + bankIn + miscIn - bankOut;
  const actual   = parseFloat(bankDcbForm.amt);
  const variance = actual - expected;
  bankDcbList.push({...bankDcbForm, amt:actual, bankIn, miscIn, bankOut, expected, variance, obAmt:ob.amt, obDate:ob.date});
  bankDcbList.sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(bankDcbList.length>30) bankDcbList = bankDcbList.slice(-30);
  scheduleSave();
  stk("Bank closing balance saved!","ok");vw="home";render();
}

function logVariance(expected, actual, mode) {
  const diff = expected - actual;
  if(diff === 0) return;
  const cat = "Variance Reconciliation";
  exps.push({id:"EXP-"+gid().replace("ID-",""), date:tdi(), cat, mode, amt:diff});
  if(!expCats.includes(cat)) expCats.push(cat);
  scheduleSave();
  stk("Variance reconciled as "+cat, "ok");
  rc();
}

function editOrder(id){
  const o=ords.find(x=>x.id===id);
  if(!o) return;
  editingOrder=id;
  // Convert display date (e.g. "18 Mar 2026") back to YYYY-MM-DD for the date input
  // If ddRaw was stored use it directly, otherwise parse the display string
  let ddForInput = o.ddRaw || '';
  if(!ddForInput && o.dd){
    try {
      const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      const parts = o.dd.split(' '); // ["18","Mar","2026"]
      if(parts.length===3){
        const day=parts[0].padStart(2,'0');
        const mon=String(months[parts[1]]+1).padStart(2,'0');
        ddForInput = `${parts[2]}-${mon}-${day}`;
      }
    } catch(e){ ddForInput=''; }
  }
  os={
    id: o.id,
    date: o.date,
    name: o.name,
    mob: o.mob,
    dd: ddForInput,
    items: o.items.map(i=>({pid:i.pid, qty:i.qty, adjRate:i.adjRate, snapRate:i.snapRate}))
  };
  pg="Home"; vw="order"; render();
}

function saveEditedOrder(){
  const name=sc((os.name||"").trim()),mob=(os.mob||"").trim();
  if(!name||mob.length<10){stk("Please fill in customer details","err");return;}
  if(!os.dd){stk("Please select a delivery date","err");return;}

  if(!v.length){stk("Please add at least one item","err");return;}
  const idx=ords.findIndex(x=>x.id===editingOrder);

  v.forEach(it=>{ if(it._pendingAdj){ rateAdjLogs.push({date:tdi(), orderId:editingOrder, ...it._pendingAdj}); delete it._pendingAdj; }
    if(it.snapRate===undefined){ const p=PR.find(x=>x.id===parseInt(it.pid)); it.snapRate=it.adjRate!==undefined?it.adjRate:(p?p.p:0); }
  });
  ords[idx]={...ords[idx], name, mob, dd:fdate(os.dd), ddRaw:os.dd, items:v, total:Math.ceil(ot())};

  document.querySelectorAll(".pay-opt").forEach(b=>b.classList.remove("selected"));

function confirmPayment(){
  if(!payModal.selected)return;
  const method=payModal.selected;
  const o=ords.find(x=>x.id===payModal.orderId);
  if(!o) return;
  const entered = parseFloat(payModal.payAmt);
  const remaining = o.total - (o.amtPaid||0);
  if(isNaN(entered)||entered<=0){stk("Enter a valid amount","err");return;}
  if(entered>remaining+0.01){stk("Amount cannot exceed remaining balance ₹"+Math.round(remaining),"err");return;}
  const newAmtPaid = (o.amtPaid||0) + entered;
  // Track per-method amounts
  if(method==='cash') o.cashPaid = (o.cashPaid||0) + entered;
  else                o.gpayPaid = (o.gpayPaid||0) + entered;
  o.payMethod = method; // last method used (for badge display fallback)
  if(Math.abs(newAmtPaid - o.total) < 0.01){
    o.status="paid"; o.payDate=payModal.payDate||tdi(); o.amtPaid=o.total;
    stk("Payment recorded — order fully paid!","ok");
  } else {
    o.status="partial"; o.lastPayDate=payModal.payDate||tdi(); o.amtPaid=newAmtPaid;
    stk("Partial payment of ₹"+Math.round(entered)+" recorded","ok");
  }
  scheduleSave();
  payModal={open:false,orderId:"",selected:"",payDate:"",payAmt:""};render();
}

function cleanMob(val){
  // Strip +91, country codes, spaces, dashes
  return val.replace(/\+91[\s-]?/g,'').replace(/[\s\-]/g,'').replace(/\D/g,'').slice(0,10);
}

  os.mob=cleaned;
  const nameEl=document.getElementById("inp-name"),hint=document.getElementById("mob-hint");
  const existing=custs.find(c=>c.mob===cleaned);
  if(existing&&cleaned.length===10){

async function getBase64ImageFromUrl(imageUrl) {
  try {
    const res = await fetch(imageUrl);
    if (res.ok) {
      const blob = await res.blob();
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(blob);
      });
    }
  } catch(e) {}
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch(e) {resolve(null);}
    };
    img.onerror = () => resolve(null);
    img.src = imageUrl;
  });
}

const STOCK_TRACKED_CATS = ['snack', 'powder', 'special', 'pickle'];
const STOCK_OPT_IN_CATS  = ['special', 'pickle']; // off by default, must be explicitly included
function getAllStockProducts(){ return PR.filter(p=>STOCK_TRACKED_CATS.includes(p.c)); }
function getTrackedProducts(){
  const excl = stockData.excludedProducts || [];
  const incl = stockData.includedProducts || [];
  return getAllStockProducts().filter(p => {
    if(STOCK_OPT_IN_CATS.includes(p.c)) return incl.includes(p.id); // opt-in: off by default
    return !excl.includes(p.id);                                      // opt-out: on by default
  });
}
function toggleStockProduct(id, cat){
  if(STOCK_OPT_IN_CATS.includes(cat)){
    if(!stockData.includedProducts) stockData.includedProducts=[];
    const idx = stockData.includedProducts.indexOf(id);
    if(idx===-1) stockData.includedProducts.push(id);
    else stockData.includedProducts.splice(idx,1);
  } else {
    if(!stockData.excludedProducts) stockData.excludedProducts=[];
    const idx = stockData.excludedProducts.indexOf(id);
    if(idx===-1) stockData.excludedProducts.push(id);
    else stockData.excludedProducts.splice(idx,1);
  }
  scheduleSave(); rc();
}

// ── Preset helpers ────────────────────────────────────────────
const BUILTIN_PRESETS = [
  { id:'podi_snack', name:'Podi & Snacks', excl:[], incl:[], cats:['snack','powder'] },
  { id:'all',        name:'All',           excl:[], incl:[], cats:['snack','powder','special','pickle'] },
];

function applyPreset(preset){
  const all = getAllStockProducts();
  stockData.excludedProducts = [];
  stockData.includedProducts = [];
  all.forEach(p => {
    const inCats = preset.cats ? preset.cats.includes(p.c) : false;
    if(preset.excl && preset.excl.includes(p.id)) {
      if(!STOCK_OPT_IN_CATS.includes(p.c)) stockData.excludedProducts.push(p.id);
    } else if(STOCK_OPT_IN_CATS.includes(p.c)){
      // opt-in: include if cat is in preset.cats or product explicitly in incl
      if(inCats || (preset.incl && preset.incl.includes(p.id))) stockData.includedProducts.push(p.id);
    } else {
      // opt-out: exclude if cat not in preset.cats
      if(!inCats) stockData.excludedProducts.push(p.id);
    }
  });
  scheduleSave(); rc();
}

function isPresetActive(preset){
  const all = getAllStockProducts();
  if(!all.length) return false;
  const excl = stockData.excludedProducts || [];
  const incl = stockData.includedProducts || [];
  return all.every(p => {
    const isOptIn = STOCK_OPT_IN_CATS.includes(p.c);
    const currentlyOn = isOptIn ? incl.includes(p.id) : !excl.includes(p.id);
    // Work out what this preset would activate for this product
    let presetOn;
    if(preset.pids){
      // Custom preset stored with explicit pids list
      presetOn = preset.pids.includes(p.id);
    } else if(preset.cats){
      // Builtin preset defined by category list
      presetOn = preset.cats.includes(p.c);
    } else {
      presetOn = isOptIn ? !!(preset.incl?.includes(p.id)) : !(preset.excl?.includes(p.id));
    }
    return currentlyOn === presetOn;
  });
}

function savePreset(){
  const pb = stockPresetBuilder;
  if(!pb.name.trim()){ stk('Give your preset a name','err'); return; }
  if(!stockData.presets) stockData.presets=[];
  // Derive cats from included products
  const all = getAllStockProducts();

  }).map(p=>p.id);
  stockData.presets.push({ name:pb.name.trim(), excl:[...pb.excl], incl:[...pb.incl], cats:null, pids:activePids });

}

function getMondayOfWeek(d){
  const dt=new Date(d); dt.setHours(0,0,0,0);
  const day=dt.getDay();
  dt.setDate(dt.getDate()-(day===0?6:day-1));
  return dt;
}

// Returns a single period object {start, end, label} at the given offset from "current"
function getStockPeriodAt(mode, offset){
  const today=new Date();
  if(mode==='weekly'){
    const mon=getMondayOfWeek(today);
    const s=new Date(mon); s.setDate(mon.getDate()+offset*7); s.setHours(0,0,0,0);
    const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999);
    const label='Week of '+s.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    return{start:s,end:e,label};
  } else if(mode==='fortnightly'){
    const REF=new Date(2025,0,6);
    const monToday=getMondayOfWeek(today);
    const wks=Math.floor((monToday-REF)/(7*86400000));
    const fn=Math.floor(wks/2);
    const s=new Date(REF); s.setDate(REF.getDate()+(fn+offset)*14); s.setHours(0,0,0,0);
    const e=new Date(s); e.setDate(s.getDate()+13); e.setHours(23,59,59,999);
    const label='Fortnight of '+s.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    return{start:s,end:e,label};
  } else {
    const d=new Date(today.getFullYear(),today.getMonth()+offset,1);
    const s=new Date(d.getFullYear(),d.getMonth(),1); s.setHours(0,0,0,0);
    const e=new Date(d.getFullYear(),d.getMonth()+1,0); e.setHours(23,59,59,999);
    const label=s.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    return{start:s,end:e,label};
  }
}

// Compute single period stock for one product given a carry-in balance
function computePeriodForProduct(period, pid, carryIn){
  const prodLog = stockData.productionLog || [];
  const production = prodLog
    .filter(l => { const d = new Date(l.date); return d >= period.start && d <= period.end; })
    .reduce((s,l) => s + l.items.filter(it => parseInt(it.pid) === pid).reduce((ss,it) => ss + (parseFloat(it.qty)||0), 0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const ordered = ords
    .filter(o => { 
      const d = getDelivDate(o);
      const isFuture = d >= today;
      const isPaid   = o.status === 'paid' || o.status === 'partial';
      if(!isFuture && !isPaid) return false; // overdue AND unpaid → exclude
      return d >= period.start && d <= period.end; 
    })
    .reduce((s,o) => s + o.items.filter(it => parseInt(it.pid) === pid).reduce((ss,it) => ss + (parseFloat(it.qty)||0), 0), 0);
  const productionCol = Math.max(0, carryIn) + production; // carry-in + this period's production
  const spare = productionCol - ordered;
  // Check for a stock recording in this period
  const recs = (stockData.stockRecordings || [])
    .filter(r => { const d = new Date(r.date); return d >= period.start && d <= period.end; })
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  const latestRec = recs[0] || null;
  let actual = null;
  if(latestRec){
    const ri = latestRec.items.find(it => parseInt(it.pid) === pid);
    if(ri !== undefined) actual = parseFloat(ri.qty) || 0;
  }
  const closing = actual !== null ? actual : spare; // actual recording overrides calculated spare
  const variance = actual !== null ? actual - spare : null;
  return { production, ordered, productionCol, spare, actual, closing, variance, hasRecording: latestRec !== null };
}

// Find how many periods back we need to go to capture all data
function findEarliestOffset(mode){
  const allDates = [
    ...(stockData.productionLog||[]).map(l => new Date(l.date)),
    ...ords.filter(o => o.ddRaw || o.dd || o.date).map(o => getDelivDate(o))
  ].filter(d => !isNaN(d));
  if(!allDates.length) return 0;
  const earliest = new Date(Math.min(...allDates));
  // Walk back until we find the period containing earliest date
  for(let i = 0; i >= -260; i--){ // up to 5 years back
    const p = getStockPeriodAt(mode, i);
    if(earliest >= p.start && earliest <= p.end) return i;
    if(earliest > p.end) return i + 1; // earlier than any data, stop
  }
  return -260;
}

// Chain all periods from earliest to targetOffset, returning per-product data at targetOffset
function getProductStockData(mode, targetOffset){
  const tracked = getTrackedProducts();
  const earliestOffset = Math.min(findEarliestOffset(mode), targetOffset);
  // Build carry-in map per product (starts at 0)
  const carryIn = {};
  tracked.forEach(p => { carryIn[p.id] = 0; });
  // Chain from earliest to one before target
  for(let i = earliestOffset; i < targetOffset; i++){
    const period = getStockPeriodAt(mode, i);
    tracked.forEach(p => {
      const r = computePeriodForProduct(period, p.id, carryIn[p.id]);
      carryIn[p.id] = r.closing;
    });
  }
  // Now compute target period using accumulated carry-ins
  const targetPeriod = getStockPeriodAt(mode, targetOffset);
  const hasAnyRec = (stockData.stockRecordings||[]).some(r => {
    const d = new Date(r.date); return d >= targetPeriod.start && d <= targetPeriod.end;
  });
  return tracked.map(p => {
    const r = computePeriodForProduct(targetPeriod, p.id, carryIn[p.id]);
    return {
      id: p.id, name: p.n, unit: p.u, cat: p.c,
      carryIn:       Math.round(carryIn[p.id]*10)/10,
      production:    Math.round(r.productionCol*10)/10,   // carry-in + this period's production
      rawProduction: Math.round(r.production*10)/10,       // just this period's production
      ordered:       Math.round(r.ordered*10)/10,
      spare:         Math.round(r.spare*10)/10,
      actual:        r.actual,
      variance:      r.variance !== null ? Math.round(r.variance*10)/10 : null,
      hasRecording:  r.hasRecording,
      closing:       Math.round(r.closing*10)/10
    };
  });
}

// Product order graph ─────────────────────────────────────────
function statusLabel(s){ return {paid:'Paid',partial:'Partially Paid',outstanding:'Outstanding',completed:'Pending Payment'}[s]||s; }
function statusColor(s){ return {paid:'#16a34a',partial:'#d97706',outstanding:'#dc2626',completed:'#2563eb'}[s]||'var(--text-muted)'; }

function renderProductGraph(pid){
  const p = PR.find(x=>x.id===pid);
  if(!p) return '';
  const period = getStockPeriodAt(stockGraphMode, stockGraphOffset);
  // All orders that have this product, delivery date in period
  const ordersInPeriod = ords
    .filter(o=>{ const d=getDelivDate(o); return d>=period.start&&d<=period.end; })
    .filter(o=>o.items.some(it=>parseInt(it.pid)===pid))
    .map(o=>{
      const qty=o.items.filter(it=>parseInt(it.pid)===pid).reduce((s,it)=>s+(parseFloat(it.qty)||0),0);
      return { id:o.id, name:o.name, date:getDelivDate(o), ddRaw:o.ddRaw||o.date, qty, status:o.status };
    })
    .sort((a,b)=>a.date-b.date);

  const W=320,pT=24,pB=40,pL=36,pR=16,dotR=6;
  const cW=W-pL-pR, cH=120;
  const H=pT+cH+pB;
  const totalDays=Math.max(1,Math.round((period.end-period.start)/86400000));
  const maxQty=Math.max(...ordersInPeriod.map(o=>o.qty),0.5);

  // Build nice Y ticks
  const rawStep=maxQty/3; const mag=Math.pow(10,Math.floor(Math.log10(rawStep||1)));
  const niceStep=Math.max(0.5,Math.ceil(rawStep/mag)*mag);
  const yTicks=[0,1,2,3].map(i=>Math.round(i*niceStep*10)/10);
  const yMax=yTicks[3]||1;

  const dateToX = d => pL + ((d-period.start)/86400000/totalDays)*cW;
  const qtyToY  = q => pT + cH - (q/yMax)*cH;

  // Grid lines & y labels
  const yLines = yTicks.map(v=>{
    const y=qtyToY(v);
    return `<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#e4dcf0" stroke-width="${v===0?1:0.6}" stroke-dasharray="${v===0?'':'3,3'}"/>
    <text x="${pL-4}" y="${y+3.5}" text-anchor="end" font-size="8" fill="#958a9e" font-family="Plus Jakarta Sans,sans-serif">${v}</text>`;
  }).join('');

  // X axis date labels — adaptive to period length
  const labelCount = totalDays<=7?totalDays:totalDays<=14?7:6;
  const xLabels = Array.from({length:labelCount+1},(_,i)=>{
    const d=new Date(period.start); d.setDate(period.start.getDate()+Math.round(i*(totalDays/labelCount)));
    const x=dateToX(d);
    const lbl=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
    return `<text x="${x}" y="${H-4}" text-anchor="middle" font-size="7.5" fill="#958a9e" font-family="Plus Jakarta Sans,sans-serif">${lbl}</text>`;
  }).join('');

  // Line path connecting dots
  const linePath = ordersInPeriod.length>1
    ? `<polyline points="${ordersInPeriod.map(o=>`${dateToX(o.date).toFixed(1)},${qtyToY(o.qty).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--pink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>`
    : '';

  // Dots — coloured by status
  const dots = ordersInPeriod.map(o=>{
    const x=dateToX(o.date).toFixed(1), y=qtyToY(o.qty).toFixed(1);
    const col=statusColor(o.status);
    return `<circle cx="${x}" cy="${y}" r="${dotR}" fill="${col}" stroke="white" stroke-width="2" style="cursor:pointer;" onclick="stockGraphDot='${o.id}';rc();"/>
    <text x="${x}" y="${parseFloat(y)-dotR-3}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${col}" font-family="Plus Jakarta Sans,sans-serif">${o.qty}</text>`;
  }).join('');

  // Popup for tapped dot
  let popup='';
  if(stockGraphDot){
    const tapped = ordersInPeriod.find(o=>o.id===stockGraphDot);
    if(tapped){
      popup=`<div style="background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 4px 16px rgba(64,56,68,.12);">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:800;color:var(--text-dark);">${tapped.name}</div>
          <button onclick="stockGraphDot=null;rc();" style="background:var(--lavender);border:none;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text-muted);font-family:inherit;">✕</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div style="font-size:11px;color:var(--text-muted);font-weight:600;">Delivery: <span style="color:var(--text-dark);font-weight:800;">${fdate(tapped.ddRaw)}</span></div>
          <div style="font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:${statusColor(tapped.status)}22;color:${statusColor(tapped.status)};">${statusLabel(tapped.status)}</div>
        </div>
        <div style="margin-top:6px;font-size:12px;font-weight:700;color:var(--text-dark);">Qty: ${tapped.qty} ${p.u}</div>
      </div>`;
    }
  }

  const isEmpty = ordersInPeriod.length===0;
  const svgContent = isEmpty
    ? `<div style="text-align:center;padding:32px 0;color:var(--text-muted);">
        <div style="font-size:12px;font-weight:700;">No orders this period</div>
        <div style="font-size:11px;margin-top:3px;">Try navigating to a different period</div>
       </div>`
    : `<svg width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;">${yLines}${xLabels}${linePath}${dots}</svg>`;

  return `<div style="overflow:hidden;">${svgContent}</div>${popup}`;
}

function orderSection(title,dotColor,badgeBg,badgeColor,statusKey,totalColor,list){
  let filtered=list.filter(o=>o.status===statusKey);
  if(statusKey==="outstanding") filtered=filtered.slice().sort((a,b)=>new Date(a.ddRaw||a.date)-new Date(b.ddRaw||b.date));
  return`<div class="sec-header"><div class="sec-dot" style="background:${dotColor};"></div>
    <span class="sec-title" style="color:${dotColor};">${title}</span>
    <span class="sec-count" style="background:${badgeBg};color:${badgeColor};">${filtered.length}</span></div>
  ${filtered.length===0?`<div style="background:#fff;border-radius:14px;padding:14px;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:12px;">No orders here</div>`
  :filtered.map(o=>{
    const lines=o.items.map(it=>{const p=PR.find(x=>x.id===parseInt(it.pid));return p?`${p.n} × ${it.qty}${p.u}`:""}).filter(Boolean).join(" · ");

    const remaining = o.total - amtPaid;
    return`<div class="ocrd">
      <div class="ocrd-head">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="ocrd-id">${o.id}</span>
            ${o.source==='whatsapp'?`<svg width="13" height="13" viewBox="0 0 24 24" fill="#25d366" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2.006 22l4.932-1.409A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.946 7.946 0 01-4.344-1.288l-.311-.186-3.217.918.897-3.14-.204-.32A7.96 7.96 0 014 12c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8z"/></svg>`:''}
          </div>
          <span class="ocrd-date">${o.date}</span>
        </div>
        <div class="ocrd-name">${o.name}</div><div class="ocrd-meta">+91 ${o.mob} · Deliver: ${o.dd}</div>
      </div>
      <div class="ocrd-items">${lines}</div>
      <div class="ocrd-footer">
        <div>
          <span class="ocrd-total" style="color:${totalColor};">₹${Math.round(o.total)}</span>
          ${statusKey==="partial"?`<div style="font-size:11px;font-weight:700;color:#f97316;margin-top:2px;">Paid ₹${Math.round(amtPaid)} · Due ₹${Math.round(remaining)}</div>`:''}
        </div>
        <div class="ocrd-actions">
          ${statusKey==="outstanding"?`<button class="oact oact-complete" onclick="markComplete('${o.id}')">✓ Complete</button>`:""}
          ${statusKey==="outstanding"||statusKey==="completed"||statusKey==="partial"?`<button class="oact" style="background:#e0f2fe;color:#0369a1;" onclick="editOrder('${o.id}')">✏️ Edit</button>`:""}
          ${statusKey==="completed"||statusKey==="partial"?`<button class="oact oact-pay" onclick="openPayModal('${o.id}')">💳 Pay</button>`:""}
          ${statusKey==="paid"||statusKey==="partial"?`<span class="oact-paid-badge">${(()=>{
            const parts=[];
            if(o.cashPaid>0) parts.push('Cash ₹'+Math.round(o.cashPaid));
            if(o.gpayPaid>0) parts.push('GPay ₹'+Math.round(o.gpayPaid));
            if(!parts.length) parts.push(o.payMethod==='gpay'?'GPay':'Cash');
            return '✓ '+parts.join(' + ');
          })()}${o.payDate?' · '+fdate(o.payDate):''}</span>`:""}
          <button class="oact oact-invoice" onclick="openInvoice('${o.id}')">🧾 Invoice</button>
          <button class="oact oact-del" onclick="deleteOrder('${o.id}')">🗑️ Delete</button>
        </div>
      </div>
    </div>`;
  }).join("")}`;
}

  if(pg==="Home"){
    el.innerHTML=`<div class="main"><div class="pg-title">Good day! 👋</div><div class="sl">Quick Actions</div>

  } else if(pg==="Orders"){
    let s = new Date(ordStart); s.setHours(0,0,0,0);

        const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

    // All orders matching search (no date filter) — for Outstanding/Pending/Partial
    const allSearchOrds = ords.filter(o =>
      !searchTerm || o.name.toLowerCase().includes(searchTerm) || o.mob.includes(searchTerm)

    // Date-filtered orders by delivery date — for Paid section and Total Value
    const visibleOrds = ords.filter(o => {
      const dd = getDeliveryDate(o);

    const paidInRange = ords.filter(o => {
      if(o.status !== 'paid' && o.status !== 'partial') return false;

      return !isNaN(pd) && pd >= s && pd <= e;
    });
    const runTotal = paidInRange.reduce((sum,o)=>sum+(o.amtPaid||o.total),0);
    // Current month total order value — all orders with delivery date in current month
    const rangeEnd = new Date(ordEnd);

    const cntOutstanding = ords.filter(o=>o.status==="outstanding").length;
    const cntPending     = ords.filter(o=>o.status==="completed").length;
    const cntPartial     = ords.filter(o=>o.status==="partial").length;

        </div>
        <div style="background:#fff7ed;border:1.5px solid #fed7aa;border-radius:14px;padding:12px;">
          <div style="font-size:9px;font-weight:800;color:#f97316;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Awaiting Pay</div>
          <div style="font-size:24px;font-weight:800;color:#f97316;">${cntPending}</div>
        </div>
        <div style="background:#fffbeb;border:1.5px solid #fde68a;border-radius:14px;padding:12px;">
          <div style="font-size:9px;font-weight:800;color:#d97706;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;">Part. Paid</div>
          <div style="font-size:24px;font-weight:800;color:#d97706;">${cntPartial}</div>
        </div>
      </div>
      <div class="dr-wrap">
        <input type="date" class="dr-inp" value="${ordStart}" onchange="ordStart=this.value; rc()" />
        <span style="font-size:12px;color:var(--text-muted);font-weight:700;">to</span>
        <input type="date" class="dr-inp" value="${ordEnd}" onchange="ordEnd=this.value; rc()" />
      </div>
      <div style="font-size:10px;color:var(--text-muted);font-weight:600;margin:-8px 0 12px;letter-spacing:.04em;">↑ "Paid (date range)" uses payment date · Paid tab list uses delivery date</div>
      <div style="position:relative;margin-bottom:12px;">
        <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="ord-search-inp" class="fi" style="padding-left:34px;" placeholder="Search by name or mobile..." value="${ordSearch}" oninput="updateOrdSearch(this.value)"/>
        ${ordSearch?`<div onclick="ordSearch='';rc();" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:var(--text-muted);line-height:1;">✕</div>`:''}
      </div>
      <div class="stat-card" style="margin-bottom:14px;">
        <div class="stat-lbl">Order Value — ${rangeEnd.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>

        <div class="stat-row" style="margin-top:10px;padding-top:10px;">
          <div class="stat-col"><div class="stat-lbl">Paid (date range)</div><div style="font-size:16px;font-weight:800;color:#16a34a;">₹${Math.round(runTotal)}</div></div>
        </div>
      </div>
      <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;" class="filter-scroll">
        ${filterTabs.map(f=>`<button onclick="ordStatusFilter='${f}';rc();" style="flex-shrink:0;padding:7px 12px;border-radius:20px;border:1.5px solid ${ordStatusFilter===f?'var(--pink)':'var(--border)'};background:${ordStatusFilter===f?'var(--pink-pale)':'var(--white)'};color:${ordStatusFilter===f?'var(--pink)':'var(--text-muted)'};font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;">${filterLabels[f]}</button>`).join("")}

        :( ordStatusFilter!=="all"
          ? orderSection(filterLabels[ordStatusFilter],
              ordStatusFilter==="outstanding"?"#dc2626":ordStatusFilter==="completed"?"#f97316":ordStatusFilter==="partial"?"#d97706":"#16a34a",

              ordStatusFilter, ordStatusFilter==="outstanding"?"#dc2626":ordStatusFilter==="completed"?"#f97316":ordStatusFilter==="partial"?"#d97706":"#16a34a",
              filteredByStatus)
          : orderSection("Outstanding","#dc2626","#fee2e2","#991b1b","outstanding","#dc2626",allSearchOrds)

            +orderSection("Paid","#16a34a","#dcfce7","#166534","paid","#16a34a",visibleOrds)
        )}</div>`;
  } else if(pg==="Cashflow"){
    if (vw === "cf_monthly") {
        const mStats = {};
        const getMonthKey = (dStr) => {
            const d = new Date(dStr);
            if(isNaN(d)) return null;
            const y = d.getFullYear();
            const m = String(d.getMonth()+1).padStart(2,'0');
            return y+'-'+m;

        const getMonthName = (k) => {

            const d = new Date(y, parseInt(m)-1, 1);

        ords.forEach(o => {
            if(o.status === 'paid' || o.status === 'partial') {
                const pd = getPaymentDate(o); if(isNaN(pd)) return;
                const k = getMonthKey(pd.toISOString().slice(0,10));
                if(!k) return;
                if(!mStats[k]) mStats[k] = {in:0, out:0, personal:0, grocery:0};
                mStats[k].in += (o.amtPaid||o.total);
            }
        });
        miscBankIncomes.forEach(m => {
            const k = getMonthKey(m.date);
            if(!k) return;
            if(!mStats[k]) mStats[k] = {in:0, out:0, misc:0, personal:0, grocery:0};
            mStats[k].misc = (mStats[k].misc||0) + m.amt; // tracked separately, not added to inflow
        });
        exps.forEach(e => {
            const k = getMonthKey(e.date);
            if(!k) return;
            if(!mStats[k]) mStats[k] = {in:0, out:0, misc:0, personal:0, bizOut:0};
            mStats[k].out += e.amt;
            if(e.cat==='Personal') mStats[k].personal = (mStats[k].personal||0) + e.amt;

        el.innerHTML=`<div class="main">

            <div><div style="font-size:17px;font-weight:800;color:var(--text-dark);">Monthly Statistics</div></div>

          ${sortedKeys.length === 0 ? `<div class="em"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 13h4"/></svg><div class="et">No data yet</div></div>` : sortedKeys.map(k => {
              const s = mStats[k];
              const net = s.in - s.out;
              const bProfit = s.in - (s.bizOut||0);
              const bPct = s.in > 0 ? Math.round(bProfit / s.in * 100) : 0;
              return `<div class="ocrd" style="padding:16px;">

                <div style="display:flex;justify-content:space-between;margin-bottom:8px;">

                    <span style="font-size:13px;font-weight:800;color:#16a34a;">₹${Math.round(s.in)}</span>
                </div>
                ${(s.misc||0)>0?`<div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                    <span style="font-size:12px;color:var(--text-muted);font-weight:700;">MISC INCOME</span>
                    <span style="font-size:13px;font-weight:800;color:#2563eb;">₹${Math.round(s.misc)}</span>

                <div style="display:flex;justify-content:space-between;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border);">
                    <span style="font-size:12px;color:var(--text-muted);font-weight:700;">OUTFLOW</span>
                    <span style="font-size:13px;font-weight:800;color:#dc2626;">₹${Math.round(s.out)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                    <span style="font-size:12px;color:var(--text-dark);font-weight:800;">NET BALANCE</span>
                    <span style="font-size:15px;font-weight:800;color:var(--text-dark);">₹${Math.round(net)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:2px dashed var(--border);">
                    <span style="font-size:12px;font-weight:800;color:var(--text-dark);">BUSINESS ${bProfit>=0?'PROFIT':'LOSS'}</span>
                    <div style="text-align:right;">
                      <span style="font-size:15px;font-weight:800;color:${bProfit>=0?'#16a34a':'#dc2626'};">₹${Math.round(Math.abs(bProfit))}</span>
                      <span style="font-size:11px;font-weight:800;color:${bPct>=0?'#16a34a':'#dc2626'};margin-left:6px;">${bPct}%</span>
                    </div>
                </div>
              </div>`;
          }).join("")}
        </div>`;
    } else {
        let s = new Date(cfStart); s.setHours(0,0,0,0);
        let e = new Date(cfEnd); e.setHours(23,59,59,999);
        const cfOrds = ords.filter(o => {
          if(o.status !== 'paid' && o.status !== 'partial') return false;
          const payDt = getPaymentDate(o);
          return !isNaN(payDt) && payDt >= s && payDt <= e;
        });
        const cfMisc = miscBankIncomes.filter(m => {
          let d = new Date(m.date);
          return d >= s && d <= e;
        });
        const cfExps = exps.filter(x => {
          let d = new Date(x.date);
          return d >= s && d <= e;
        });
        const miscInflow = cfMisc.reduce((sum, m) => sum + m.amt, 0);
        const gpayInflow = cfOrds.reduce((sum,o)=>sum+(o.gpayPaid!==undefined?o.gpayPaid:(o.payMethod==='gpay'?(o.amtPaid||o.total):0)),0);
        const cashInflow = cfOrds.reduce((sum,o)=>sum+(o.cashPaid!==undefined?o.cashPaid:(o.payMethod==='cash'?(o.amtPaid||o.total):0)),0);

        const outflow = cfExps.reduce((sum, x) => sum + x.amt, 0);
        // Business Profit: (Inflow - Misc Income) - Outflow + Personal + Grocery & Snacks
        const personalExp = cfExps.filter(e=>e.cat==='Personal').reduce((s,e)=>s+e.amt,0);
        const bizExpenses = cfExps.filter(e=>!expNonBiz.includes(e.cat)).reduce((s,e)=>s+e.amt,0);
        const businessProfit = inflow - bizExpenses;
        const profitPct = inflow > 0 ? Math.round(businessProfit / inflow * 100) : 0;

        // Donut chart maths
        const donutTotal = gpayInflow + cashInflow + miscInflow;
        function donutSlice(val, total, startAngle, color, segment){
          if(total===0||val===0) return '';
          const pct = val/total;
          const angle = pct * 2 * Math.PI;
          const endAngle = startAngle + angle;
          const cx=80, cy=80, r=58, ir=36;
          const x1=cx+r*Math.sin(startAngle), y1=cy-r*Math.cos(startAngle);
          const x2=cx+r*Math.sin(endAngle),   y2=cy-r*Math.cos(endAngle);
          const xi1=cx+ir*Math.sin(startAngle),yi1=cy-ir*Math.cos(startAngle);
          const xi2=cx+ir*Math.sin(endAngle),  yi2=cy-ir*Math.cos(endAngle);
          const large = angle>Math.PI?1:0;
          const isExp = segment && segment.startsWith('exp_');
          const activeVar = isExp ? cfExpDonutSegment : cfDonutSegment;
          const isActive = activeVar===segment;
          const hasSel = activeVar !== null;
          const scale = isActive ? 'scale(1.04)' : 'scale(1)';

          return `<path d="M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${xi2},${yi2} A${ir},${ir} 0 ${large},0 ${xi1},${yi1} Z" fill="${color}" opacity="${hasSel&&!isActive?'0.4':'1'}" style="cursor:pointer;transform-origin:80px 80px;transform:${scale};transition:all .2s;" onclick="${stateVar}=${stateVar}==='${segment}'?null:'${segment}';rc();"/>`;
        }
        let a = 0;
        const sliceGpay = donutSlice(gpayInflow, donutTotal, a, '#b81273','gpay'); a += donutTotal>0?(gpayInflow/donutTotal)*2*Math.PI:0;

        const sliceMisc = donutSlice(miscInflow,  donutTotal, a, '#2563eb','misc');
        const gpayPct = donutTotal>0 ? Math.round(gpayInflow/donutTotal*100) : 0;
        const cashPct = donutTotal>0 ? Math.round(cashInflow/donutTotal*100) : 0;
        const miscPct = donutTotal>0 ? Math.round(miscInflow/donutTotal*100)  : 0;

        function legendRow(seg, color, label, pct, amt){

              <span style="font-size:12px;font-weight:800;color:${color};">${pct}%</span>
            </div>
            <div style="font-size:13px;font-weight:800;color:var(--text-dark);">₹${Math.round(amt).toLocaleString('en-IN')} ${isActive?'<span style="font-size:10px;font-weight:600;color:'+color+'">▾ tap to close</span>':'<span style="font-size:10px;font-weight:600;color:var(--text-muted);">tap to view</span>'}</div>
          </div>`;
        }

        // Build popup content based on selected segment
        let popupHTML = '';
        if(cfDonutSegment){
          const seg = cfDonutSegment;
          const segColor = seg==='gpay'?'#b81273':seg==='cash'?'#16a34a':'#2563eb';
          const segLabel = seg==='gpay'?'GPay':seg==='cash'?'Cash':'Misc Income';
          let txns = [];
          if(seg==='misc'){
            txns = cfMisc.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(m=>({
              name:'Bank Credit', sub: fdate(m.date), amt: m.amt, status:'misc'
            }));
          } else {
            const filteredByMethod = cfOrds.filter(o=>{
              if(seg==='gpay') return o.gpayPaid>0 || (o.gpayPaid===undefined && o.payMethod==='gpay');
              return o.cashPaid>0 || (o.cashPaid===undefined && o.payMethod==='cash');
            });
            txns = filteredByMethod.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(o=>({
              name: o.name,
              sub: fdate(o.ddRaw||o.date),
              amt: seg==='gpay' ? (o.gpayPaid!==undefined?o.gpayPaid:(o.amtPaid||o.total)) : (o.cashPaid!==undefined?o.cashPaid:(o.amtPaid||o.total)),
              status: o.status, id: o.id
            }));
          }
          const statusCol = s=>({paid:'#16a34a',partial:'#d97706',outstanding:'#dc2626',completed:'#2563eb'}[s]||'#888');
          popupHTML = `<div style="margin-top:14px;border-top:1.5px solid var(--border);padding-top:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <div style="font-size:12px;font-weight:800;color:${segColor};">${segLabel} — ${txns.length} transaction${txns.length!==1?'s':''}</div>
              <div style="font-size:12px;font-weight:800;color:var(--text-dark);">₹${Math.round(txns.reduce((s,t)=>s+t.amt,0)).toLocaleString('en-IN')}</div>
            </div>
            ${txns.length===0?`<div style="text-align:center;padding:16px 0;font-size:12px;color:var(--text-muted);font-weight:600;">No transactions found</div>`
            :txns.map(t=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
